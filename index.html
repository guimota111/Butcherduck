<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butcher Duck | Patologia</title>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Base Data -->
    <script src="data.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">

    <!-- ===== MOBILE OVERLAY ===== -->
    <div class="mobile-overlay" id="mobileOverlay" onclick="closeMobileMenu()"></div>

    <!-- ===== SIDEBAR ===== -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon-wrapper">
                <i data-lucide="feather" style="width: 22px; height: 22px;"></i>
            </div>
            <div class="brand-text">
                <span class="brand-name">Butcher Duck</span>
                <span class="brand-tagline">Patologia</span>
            </div>
        </div>

        <div class="sidebar-nav">
            <a href="#" class="nav-item" id="nav-home" onclick="navigateTo('home'); return false;">
                <span class="nav-icon"><i data-lucide="home" style="width: 18px; height: 18px;"></i></span>
                <span>Início</span>
            </a>

            <!-- Menus dinâmicos serão inseridos aqui -->
            <div id="dynamic-menus"></div>

        </div><!-- /sidebar-nav -->

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="footer-avatar">G</div>
                <div>
                    <span class="footer-name">Dr. Gui</span>
                    <span class="footer-role">Patologia Cirúrgica</span>
                </div>
            </div>
            
            <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" style="margin-bottom: 8px;">
                <span id="theme-text">Modo Escuro</span>
                <i data-lucide="moon" id="theme-icon" style="width: 14px; height: 14px;"></i>
            </button>
            <a href="admin.html" class="theme-toggle-btn" style="text-decoration: none; justify-content: center; background: rgba(59, 130, 246, 0.1); color: var(--accent); border: 1px solid rgba(59, 130, 246, 0.2);">
                <i data-lucide="database" style="width: 14px; height: 14px;"></i>
                <span>Painel CMS</span>
            </a>
        </div>
    </nav>

    <!-- ===== MAIN WRAPPER ===== -->
    <div class="main-wrapper">
        <!-- Top header for mobile -->
        <header class="top-header">
            <button class="menu-toggle" onclick="openMobileMenu()">
                <i data-lucide="menu"></i>
            </button>
            <div class="header-actions">
                <!-- Can add extra global buttons here later -->
            </div>
        </header>

        <!-- Main content area -->
        <main class="content-area" id="main"></main>
    </div>

</div>

<script>
/* ============================================================
   DATA LOADING (FROM BACKEND API)
============================================================ */
let SISTEMAS = {};

async function initData() {
    try {
        const response = await fetch('/api/sistemas');
        if (response.ok) {
            SISTEMAS = await response.json();
        } else {
            console.warn("API offline - Fallback default");
            SISTEMAS = JSON.parse(JSON.stringify(DEFAULT_SISTEMAS));
        }
    } catch(err) {
        console.warn("Network Error - Fallback default", err);
        SISTEMAS = JSON.parse(JSON.stringify(DEFAULT_SISTEMAS));
    }
}

/* ============================================================
   STATE & ONLOAD
============================================================ */
let state = { view: 'home', sistema: null, item: null };

document.addEventListener('DOMContentLoaded', async () => {
    // 0. Carregar Dados da API Backend
    await initData();

    // 1. Build Navigation dynamically 
    buildSidebar();
    
    // 2. Load theme preference
    loadTheme();
    
    // 3. Render initial state
    navigateTo('home');
    
    // 4. Draw icons
    lucide.createIcons();
});

/* ============================================================
   BUILD SIDEBAR
============================================================ */
function buildSidebar() {
    const container = document.getElementById('dynamic-menus');
    let html = `
        <div class="module-header" id="mod-btn-macroscopia" onclick="toggleModule('macroscopia')">
            <span>MÓDULO: MACROSCOPIA</span>
            <i data-lucide="chevron-down" class="chevron" style="width:14px; height:14px;"></i>
        </div>
        <div class="module-content" id="mod-content-macroscopia">
    `;
    
    Object.entries(SISTEMAS).forEach(([sysKey, sysData]) => {
        html += `
        <div class="nav-group">
            <button class="nav-group-btn" id="btn-${sysKey}" onclick="toggleGroup('${sysKey}')">
                <span class="nav-icon"><i data-lucide="${sysData.icon}" style="width:16px; height:16px;"></i></span>
                <span>${sysData.nome}</span>
                <i data-lucide="chevron-down" class="chevron" style="width:14px; height:14px;"></i>
            </button>
            <div class="nav-sub-list" id="sub-${sysKey}">
        `;
        
        Object.entries(sysData.itens).forEach(([itemKey, itemData]) => {
            html += `<a href="#" class="nav-sub-item" onclick="goItem('${sysKey}','${itemKey}'); return false;">${itemData.nome}</a>`;
        });
        
        html += `</div></div>`;
    });
    
    html += `</div>`; // Close Macroscopia Module

    // Microscopia (Em Breve)
    html += `
        <div class="module-header collapsed" id="mod-btn-microscopia" onclick="toggleModule('microscopia')">
            <span>MÓDULO: MICROSCOPIA</span>
            <i data-lucide="chevron-down" class="chevron" style="width:14px; height:14px;"></i>
        </div>
        <div class="module-content collapsed" id="mod-content-microscopia">
            <a href="#" class="nav-item" onclick="navigateTo('em_breve', 'Microscopia', 'Rotina de Lâminas (HE)'); return false;">
                <span class="nav-icon"><i data-lucide="microscope" style="width: 18px; height: 18px;"></i></span>
                <span>Lâminas (HE)</span>
            </a>
            <a href="#" class="nav-item" onclick="navigateTo('em_breve', 'Microscopia', 'Imuno-histoquímica'); return false;">
                <span class="nav-icon"><i data-lucide="test-tubes" style="width: 18px; height: 18px;"></i></span>
                <span>Imuno-histoquímica</span>
            </a>
        </div>
    `;

    html += `
        <div class="module-header collapsed" id="mod-btn-ferramentas" onclick="toggleModule('ferramentas')">
            <span>FERRAMENTAS (EM BREVE)</span>
            <i data-lucide="chevron-down" class="chevron" style="width:14px; height:14px;"></i>
        </div>
        <div class="module-content collapsed" id="mod-content-ferramentas">
            <a href="#" class="nav-item" onclick="navigateTo('em_breve', 'Ferramentas', 'Calculadoras Médicas'); return false;">
                <span class="nav-icon"><i data-lucide="calculator" style="width: 18px; height: 18px;"></i></span>
                <span>Calculadoras</span>
            </a>
        </div>
    `;

    container.innerHTML = html;
}

/* ============================================================
   THEME LOGIC
============================================================ */
function loadTheme() {
    const saved = localStorage.getItem('butcherduck_theme');
    if (saved === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        updateThemeBtn(true);
    } else {
        document.documentElement.setAttribute('data-theme', 'light');
        updateThemeBtn(false);
    }
}

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const isDark = currentTheme === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('butcherduck_theme', newTheme);
    updateThemeBtn(!isDark);
}

function updateThemeBtn(isDark) {
    const btnText = document.getElementById('theme-text');
    const themeIcon = document.getElementById('theme-icon');
    
    if (isDark) {
        btnText.textContent = 'Modo Claro';
        themeIcon.setAttribute('data-lucide', 'sun');
    } else {
        btnText.textContent = 'Modo Escuro';
        themeIcon.setAttribute('data-lucide', 'moon');
    }
    // Re-draw the icon that just changed
    lucide.createIcons();
}

/* ============================================================
   MOBILE MENU LOGIC
============================================================ */
function openMobileMenu() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('mobileOverlay').classList.add('active');
}

function closeMobileMenu() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('mobileOverlay').classList.remove('active');
}

/* ============================================================
   MODULE ACCORDION LOGIC
============================================================ */
function toggleModule(id) {
    const content = document.getElementById(`mod-content-${id}`);
    const btn = document.getElementById(`mod-btn-${id}`);
    if (content && btn) {
        content.classList.toggle('collapsed');
        btn.classList.toggle('collapsed');
        // Because DOM dynamically assigns Lucide, we might want to re-evaluate or animations handle the chevron rotate via CSS.
    }
}

/* ============================================================
   NAVIGATION
============================================================ */
function navigateTo(view, sistema = null, item = null) {
    state = { view, sistema, item };
    syncNav();
    render();
    document.getElementById('main').scrollTop = 0;
    closeMobileMenu(); // In case we navigated on mobile
}

function goItem(sistema, item) {
    openGroup(sistema);
    navigateTo('item', sistema, item);
}

function openSistema(key) {
    openGroup(key);
    navigateTo('sistema', key);
}

function toggleGroup(id) {
    const sub  = document.getElementById('sub-' + id);
    const btn  = document.getElementById('btn-' + id);
    const isOpen = sub.classList.contains('open');
    sub.classList.toggle('open', !isOpen);
    btn.classList.toggle('open', !isOpen);
}

function openGroup(id) {
    const sub = document.getElementById('sub-' + id);
    const btn = document.getElementById('btn-' + id);
    if(sub && btn) {
        sub.classList.add('open');
        btn.classList.add('open');
    }
}

function syncNav() {
    // Reset all
    document.querySelectorAll('.nav-item, .nav-sub-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-group-btn').forEach(el => el.classList.remove('group-active'));

    if (state.view === 'home') {
        document.getElementById('nav-home').classList.add('active');
        return;
    }

    if (state.sistema) {
        const btn = document.getElementById('btn-' + state.sistema);
        if (btn) btn.classList.add('group-active');
    }

    if (state.item) {
        const subItems = document.querySelectorAll(`#sub-${state.sistema} .nav-sub-item`);
        subItems.forEach(el => {
            if (el.getAttribute('onclick').includes(`'${state.item}'`)) {
                el.classList.add('active');
            }
        });
    }
}

/* ============================================================
   RENDER PAGES
============================================================ */
function render() {
    const main = document.getElementById('main');
    
    // Clear first to trigger animations
    main.innerHTML = '';
    
    setTimeout(() => {
        switch (state.view) {
            case 'home':    main.innerHTML = renderHome();    break;
            case 'sistema': main.innerHTML = renderSistema(); break;
            case 'item':    main.innerHTML = renderItem();    break;
            case 'em_breve': main.innerHTML = renderEmBreve(); break;
        }
        lucide.createIcons(); // Re-draw icons inside newly injected HTML
    }, 10);
}

function renderHome() {
    const totalSistemas = Object.keys(SISTEMAS).length;
    const totalProtocolos = Object.values(SISTEMAS).reduce((acc, s) => acc + Object.keys(s.itens).length, 0);

    const systemCards = Object.entries(SISTEMAS).map(([key, s], idx) => `
        <div class="system-card animate-slide-up" style="--system-color:${s.cor}; animation-delay: ${idx * 50}ms;" onclick="openSistema('${key}')">
            <div class="system-card-icon">
                <i data-lucide="${s.icon}" style="width: 24px; height: 24px;"></i>
            </div>
            <div class="system-card-name">${s.nome}</div>
            <div class="system-card-count">
                <i data-lucide="folder" style="width: 12px; height: 12px;"></i>
                ${Object.keys(s.itens).length} protocolos
            </div>
        </div>
    `).join('');

    return `
    <div class="animate-fade-in">
        <div class="hero-glass">
            <div class="hero-glass-content">
                <div class="hero-text-block">
                    <div class="hero-badge">🔬 Plataforma de Especialidade</div>
                    <h1>Manual de Patologia</h1>
                    <p>Guia sistematizado para descrição de peças cirúrgicas e biópsias (macroscópicas e visão futura de microscopia).</p>
                </div>
                <!-- Optional: a big subtle icon here instead of emoji -->
                <div class="hero-icon-large">
                    <i data-lucide="microscope" stroke-width="1.5" style="width: 56px; height: 56px;"></i>
                </div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(59, 130, 246, 0.15); color: #3b82f6;">
                    <i data-lucide="layout-grid"></i>
                </div>
                <div>
                    <div class="stat-value">${totalSistemas}</div>
                    <div class="stat-label">Sistemas</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.15); color: #10b981;">
                    <i data-lucide="files"></i>
                </div>
                <div>
                    <div class="stat-value">${totalProtocolos}</div>
                    <div class="stat-label">Protocolos</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b;">
                    <i data-lucide="settings"></i>
                </div>
                <div>
                    <div class="stat-value">Em dev</div>
                    <div class="stat-label">Status atual</div>
                </div>
            </div>
        </div>

        <div class="section-heading">
            <span class="section-heading-text">Módulo: Macroscopia</span>
            <div class="section-heading-line"></div>
        </div>
        
        <div class="systems-grid">${systemCards}</div>
    </div>
    `;
}

function renderSistema() {
    const s = SISTEMAS[state.sistema];
    if (!s) return '<p>Sistema não encontrado.</p>';

    const cards = Object.entries(s.itens).map(([key, item], idx) => `
        <div class="subspecialty-card animate-slide-up" style="--system-color:${s.cor}; animation-delay: ${idx * 30}ms;" onclick="goItem('${state.sistema}','${key}')">
            <div class="subcard-icon">
                <i data-lucide="${item.icon}"></i>
            </div>
            <div class="subcard-name">${item.nome}</div>
            <span class="subcard-status">Pendente</span>
        </div>
    `).join('');

    return `
    <div class="animate-fade-in">
        <div class="breadcrumb">
            <a href="#" onclick="navigateTo('home'); return false;">
                <i data-lucide="home" class="breadcrumb-icon" style="width: 14px; height: 14px;"></i> Início
            </a>
            <i data-lucide="chevron-right" class="breadcrumb-icon" style="width: 14px; height: 14px;"></i>
            <span>${s.nome}</span>
        </div>
        
        <div class="page-title-row">
            <div class="page-title-icon" style="background: ${s.cor}22; color: ${s.cor};">
                <i data-lucide="${s.icon}" style="width: 28px; height: 28px;"></i>
            </div>
            <div>
                <h1 class="page-title">${s.nome}</h1>
                <p class="page-subtitle">${s.desc}</p>
            </div>
        </div>

        <div class="section-heading">
            <span class="section-heading-text">Protocolos de Peças</span>
            <div class="section-heading-line"></div>
        </div>
        
        <div class="subspecialty-grid">${cards}</div>
    </div>
    `;
}

function changeStep(newStep) {
    state.currentStep = newStep;
    render();
}

function renderItem() {
    const s    = SISTEMAS[state.sistema];
    const item = s?.itens[state.item];
    if (!s || !item) return '<p>Conteúdo não encontrado.</p>';

    let passos = [];
    try {
        if(item.conteudo && item.conteudo.trim().startsWith('[')) {
            passos = JSON.parse(item.conteudo);
        } else if(item.conteudo && item.conteudo.trim().length > 0) {
            passos = [{ id: Date.now(), texto: item.conteudo, imgBase64: '' }];
        }
    } catch(e) {
        if(item.conteudo) passos = [{ id: Date.now(), texto: item.conteudo, imgBase64: '' }];
    }

    const headerHtml = `
        <div class="breadcrumb">
            <a href="#" onclick="navigateTo('home'); return false;">Início</a>
            <i data-lucide="chevron-right" class="breadcrumb-icon" style="width: 14px; height: 14px;"></i>
            <a href="#" onclick="openSistema('${state.sistema}'); return false;">${s.nome}</a>
            <i data-lucide="chevron-right" class="breadcrumb-icon" style="width: 14px; height: 14px;"></i>
            <span style="color: var(--text-primary); font-weight: 500;">${item.nome}</span>
        </div>
        
        <div class="page-title-row" style="margin-bottom: 24px;">
            <div class="page-title-icon">
                <i data-lucide="${item.icon}" style="width: 28px; height: 28px;"></i>
            </div>
            <div>
                <h1 class="page-title">${item.nome}</h1>
                <p class="page-subtitle">${s.nome} — Guia de Macroscopia</p>
            </div>
        </div>
    `;

    if (passos.length === 0) {
        return `
        <div class="animate-fade-in">
            ${headerHtml}
            <div class="under-dev animate-slide-up">
                <div class="under-dev-icon">
                    <i data-lucide="hammer" style="width: 32px; height: 32px;"></i>
                </div>
                <h3>Roteiro em Planejamento</h3>
                <p>O protocolo guiado para "<strong>${item.nome}</strong>" está sendo atualizado pelo Dr. Gui. Em breve contará com fotos e roteiro técnico.</p>
            </div>
        </div>
        `;
    }

    const current = state.currentStep || 0;
    const passoAtual = passos[current];
    
    let dotsHtml = '<div style="display:flex; justify-content:center; gap:8px; margin-bottom: 24px; margin-top: 16px;">';
    for(let i=0; i<passos.length; i++) {
        dotsHtml += `<div style="width:12px; height:12px; border-radius:50%; background: ${i === current ? 'var(--accent)' : 'var(--sidebar-border)'}; cursor:pointer; transition: all 0.3s;" onclick="changeStep(${i})"></div>`;
    }
    dotsHtml += '</div>';

    const hasPrev = current > 0;
    const hasNext = current < passos.length - 1;

    return `
    <div class="animate-fade-in">
        ${headerHtml}
        
        <div class="protocol-content animate-slide-up" style="background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border-color); overflow:hidden; display:flex; flex-direction:column; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
            
            ${passoAtual.imgBase64 ? 
                `<div style="width: 100%; min-height: 250px; background: rgba(0,0,0,0.05); display:flex; justify-content:center; align-items:center; border-bottom: 1px solid var(--border-color);">
                    <img src="${passoAtual.imgBase64}" style="max-width:100%; max-height:500px; object-fit:contain;">
                 </div>` 
                : ''
            }
            
            <div style="padding: 32px;">
                <div style="text-align:center; font-size: 0.85rem; color:var(--text-secondary); margin-bottom: 16px; font-weight:700; text-transform:uppercase; letter-spacing:1px; display:flex; justify-content:center; align-items:center; gap: 8px;">
                    <i data-lucide="layers" style="width:14px;"></i> PASSO ${current + 1} DE ${passos.length}
                </div>
                
                <div style="font-size: 1.15rem; line-height: 1.8; color: var(--text-primary); text-align: justify; margin-bottom: 32px;">
                    ${(passoAtual.texto || '<i style="opacity:0.6;">Nenhuma anotação descritiva inserida para este passo.</i>').replace(/\n/g, '<br>')}
                </div>
                
                ${dotsHtml}
            </div>
            
            <div style="display:flex; border-top: 1px solid var(--border-color); background: var(--bg-primary);">
                <button onclick="changeStep(${current - 1})" ${!hasPrev ? 'disabled' : ''} style="flex:1; padding: 20px; border:none; background:transparent; cursor:${hasPrev ? 'pointer' : 'not-allowed'}; font-weight:600; font-size: 1rem; color: ${hasPrev ? 'var(--text-primary)' : 'var(--border-color)'}; display:flex; align-items:center; justify-content:center; gap:8px; border-right: 1px solid var(--border-color); transition: background 0.2s;" onmouseover="${hasPrev ? "this.style.background='var(--sidebar-surface)'" : ''}" onmouseout="this.style.background='transparent'">
                    <i data-lucide="arrow-left" style="width:18px;"></i> Anterior
                </button>
                <button onclick="changeStep(${current + 1})" ${!hasNext ? 'disabled' : ''} style="flex:1; padding: 20px; border:none; background:transparent; cursor:${hasNext ? 'pointer' : 'not-allowed'}; font-weight:600; font-size: 1rem; color: ${hasNext ? 'var(--accent)' : 'var(--border-color)'}; display:flex; align-items:center; justify-content:center; gap:8px; transition: background 0.2s;" onmouseover="${hasNext ? "this.style.background='var(--sidebar-surface)'" : ''}" onmouseout="this.style.background='transparent'">
                    Próximo Passo <i data-lucide="arrow-right" style="width:18px;"></i>
                </button>
            </div>
            
        </div>
    </div>
    `;
}

function renderEmBreve() {
    return `
    <div class="animate-fade-in">
        <div class="breadcrumb">
            <a href="#" onclick="navigateTo('home'); return false;">Início</a>
            <i data-lucide="chevron-right" class="breadcrumb-icon" style="width: 14px; height: 14px;"></i>
            <span style="color: var(--text-primary); font-weight: 500;">${state.sistema}</span>
        </div>
        
        <div class="page-title-row">
            <div class="page-title-icon" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b;">
                <i data-lucide="clock" style="width: 28px; height: 28px;"></i>
            </div>
            <div>
                <h1 class="page-title">${state.item}</h1>
                <p class="page-subtitle">Módulo Futuro</p>
            </div>
        </div>

        <div class="under-dev animate-slide-up">
            <div class="under-dev-icon" style="background: rgba(245, 158, 11, 0.1); color: #f59e0b;">
                <i data-lucide="construct" style="width: 32px; height: 32px;"></i>
            </div>
            <h3>Área em Planejamento</h3>
            <p>Este módulo interno pertence à visão futura da plataforma e será desenvolvido em breve.</p>
        </div>
    </div>
    `;
}

</script>
</body>
</html>
